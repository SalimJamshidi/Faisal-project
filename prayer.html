<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a0e">
  <title>من به درگاه تو شادم</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      background: #080a0e;
      font-family: Georgia, "Times New Roman", serif;
    }

    .card {
      position: relative;
      width: min(100%, 560px);
      padding: clamp(30px, 7vw, 60px) clamp(22px, 7vw, 50px);
      background-color: #080a0e;
      background-image:
        linear-gradient(145deg, rgba(8, 10, 14, 0.72), rgba(8, 10, 14, 0.62)),
        url("assets/images/pt.jpeg");
      background-position: center, center;
      background-size: cover, contain;
      background-repeat: no-repeat, no-repeat;
      border: 1px solid rgba(240, 230, 210, 0.13);
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      text-align: center;
      animation: card-reveal 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      transition: border-color 0.45s ease, box-shadow 0.45s ease, transform 0.45s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(240, 230, 210, 0.24);
      box-shadow: 0 28px 88px rgba(0, 0, 0, 0.46), 0 0 42px rgba(201, 210, 223, 0.06);
    }

    @keyframes card-reveal {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .farsi-text {
      position: relative;
      display: grid;
      gap: 6px;
      padding: 29px 10px;
      background: radial-gradient(ellipse at center, rgba(54, 133, 139, 0.19), transparent 72%);
      margin-bottom: 34px;
      color: #d8f3f2;
      direction: rtl;
      font-family: Tahoma, "IranNastaliq", sans-serif;
      font-size: 17px;
      line-height: 2.1;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.42);
      opacity: 0.92;
      transition: color 0.4s ease, text-shadow 0.4s ease;
    }

    .farsi-text::before,
    .farsi-text::after {
      content: "";
      position: absolute;
      left: 50%;
      width: min(72%, 190px);
      height: 1px;
      background:
        radial-gradient(circle, rgba(206, 247, 236, 0.9) 0 1px, transparent 2px),
        linear-gradient(90deg, transparent, rgba(157, 215, 216, 0.58), transparent);
      transform: translateX(-50%);
    }

    .farsi-text::before {
      top: 0;
    }

    .farsi-text::after {
      bottom: 0;
    }

    .farsi-text span {
      display: block;
    }

    .farsi-text .invocation {
      justify-self: center;
      margin-top: 10px;
      padding: 7px 16px 0;
      border-top: 1px solid rgba(157, 215, 216, 0.22);
      color: #a9d8d4;
      font-size: 0.9em;
      letter-spacing: 0.04em;
    }

    .farsi-text:hover {
      color: #f2ffff;
      background: radial-gradient(ellipse at center, rgba(54, 133, 139, 0.25), transparent 74%);
      text-shadow: 0 2px 22px rgba(0, 0, 0, 0.52), 0 0 28px rgba(255, 249, 237, 0.12);
    }

    .divider {
      width: 64px;
      height: 1px;
      margin: 0 auto 32px;
      background: linear-gradient(to right, transparent, #d8c8a7, transparent);
      opacity: 0.58;
      transition: width 0.5s ease, opacity 0.5s ease;
    }

    .card:hover .divider {
      width: 100px;
      opacity: 0.9;
    }

    .english-text {
      color: #cadcde;
      font-size: 17px;
      font-style: italic;
      line-height: 2;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.4);
      transition: color 0.4s ease;
    }

    .english-text:hover {
      color: #e8f8f8;
    }

    .blessings {
      margin-top: 32px;
      color: #9fcacb;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: blessings-reveal 0.9s ease 0.65s both;
    }

    @keyframes blessings-reveal {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 0.78;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }

      .card {
        padding: 30px 20px;
        border-radius: 18px;
      }

      .english-text {
        font-size: 15px;
      }

      .farsi-text {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="farsi-text">
      <span>من به درگاه تو شادم و به کلام تو آباد</span>
      <span>تو هم خالق خلقی و هم یارِ خرابات</span>
      <span class="invocation">— یا ربّ</span>
    </div>

    <div class="divider"></div>

    <div class="english-text">
      I find joy in Your presence,<br>
      I prosper through Your word.<br>
      You are the Creator of all things,<br>
      and the Companion of the humble and sincere.<br><br>
      — O Lord.
    </div>

    <div class="blessings">✨ بسم الله ✨</div>
  </main>
</body>
</html>
